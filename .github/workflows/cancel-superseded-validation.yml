name: Cancel superseded map validation
on:
  push:
    branches: [review/revision-cleanup-20261123]
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (const run_id of [45089560337, 45089753778]) {
              const {data: run} = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id});
              if (run.head_branch !== 'review/pr-revisions-20261123') throw new Error('Unexpected validation branch');
              if (run.status !== 'completed') await github.rest.actions.cancelWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id});
            }
