name: PR revision validation
on:
  push:
    branches: [review/pr-revisions-20261123]
permissions:
  contents: read
  checks: write
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        target: [{"pr":95,"ref":"367ed5de72e6433eb358ce7d45b32e76eca7269a","repo":"pponce/LocalRock"}]
        platform: [android, ios]
    runs-on: ${{ matrix.platform == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ matrix.target.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: chmod +x gradlew
      - uses: actions/checkout@v4
        if: matrix.platform == 'ios'
        with:
          repository: emqx/CocoaMQTT
          ref: '2.4.1'
          path: local-work/dependencies/CocoaMQTT
      - name: Build and test
        id: build
        shell: bash
        run: |
          set -o pipefail
          if [ '${{ matrix.platform }}' = android ]; then
            ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug 2>&1 | tee build.log
          else
            python3 - <<'PY'
          from pathlib import Path
          p=Path('iosApp/iosApp.xcodeproj/project.pbxproj')
          p.write_text(p.read_text().replace('../../CocoaMQTT-master', '../local-work/dependencies/CocoaMQTT'))
          PY
            ./gradlew :composeApp:compileKotlinIosArm64 :composeApp:compileKotlinIosSimulatorArm64 2>&1 | tee build.log
            xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath local-work/DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a build.log
          fi
      - name: Publish diagnostics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const log=fs.existsSync('build.log')?fs.readFileSync('build.log','utf8'):'Not started';
            let report=''; const dir='composeApp/build/test-results/testDebugUnitTest';
            if(fs.existsSync(dir)) for(const f of fs.readdirSync(dir).filter(f=>f.endsWith('.xml'))) {
              const xml=fs.readFileSync(dir+'/'+f,'utf8');
              report+=(xml.match(/<testsuite[^>]*>/)||[''])[0]+'\n';
              if(!xml.includes('failures="0"')) report+=xml.slice(0,9000)+'\n';
            }
            const errors=log.split('\n').filter(l=>/^e:|error:|.* error:|.* FAILED|BUILD |.*tests completed|.*BUILD SUCCEEDED|.*BUILD FAILED/.test(l)).join('\n');
            await github.rest.checks.create({owner:context.repo.owner,repo:context.repo.repo,head_sha:context.sha,
              name:'PR ${{ matrix.target.pr }} ${{ matrix.platform }} diagnostics',status:'completed',
              conclusion:'${{ steps.build.outcome }}'==='success'?'success':'failure',
              output:{title:'Candidate ${{ matrix.target.ref }}',summary:'Build: ${{ steps.build.outcome }}',
                text:('Source: ${{ matrix.target.repo }} @ ${{ matrix.target.ref }}\n'+errors+'\n'+report+'\n'+log.slice(-6000)).slice(0,64000)}});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-${{ matrix.target.pr }}-${{ matrix.platform }}
          path: |
            build.log
            composeApp/build/test-results
            composeApp/build/reports/tests
